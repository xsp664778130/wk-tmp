services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - /etc/skillport/mysql.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - skillport_mysql_data:/var/lib/mysql

volumes:
  skillport_mysql_data:
    name: skillport_mysql_data
