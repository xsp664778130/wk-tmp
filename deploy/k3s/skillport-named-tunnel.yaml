apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillport-named-tunnel
  namespace: skillport
  labels:
    app.kubernetes.io/name: skillport-named-tunnel
    app.kubernetes.io/part-of: skillport
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: skillport-named-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillport-named-tunnel
        app.kubernetes.io/part-of: skillport
    spec:
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2026.7.3
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --protocol
            - http2
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: skillport-cloudflare-tunnel
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
