apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: skillport
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-skillport-deployer
  namespace: skillport
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-skillport-deployer
  namespace: skillport
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-skillport-deployer
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: skillport
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-home
  namespace: skillport
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 15Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: skillport
spec:
  clusterIP: 10.43.50.30
  selector:
    app.kubernetes.io/name: jenkins
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: skillport
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins
        app.kubernetes.io/part-of: skillport
    spec:
      serviceAccountName: jenkins
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: jenkins-home-permissions
          image: docker.io/rancher/mirrored-library-busybox:1.37.0
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - chown -R 1000:1000 /var/jenkins_home
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
      containers:
        - name: jenkins
          image: docker.m.daocloud.io/jenkins/jenkins:lts-jdk21
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JAVA_OPTS
              value: -Duser.timezone=Asia/Shanghai -Djenkins.install.runSetupWizard=true
            - name: PATH
              value: /opt/skillport-tools/node/bin:/opt/skillport-tools/maven/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          startupProbe:
            httpGet:
              path: /login
              port: http
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
            - name: k3s-bin
              mountPath: /usr/local/bin/k3s
              readOnly: true
            - name: bridge-artifacts
              mountPath: /srv/skillport/bridge
            - name: deploy-script
              mountPath: /usr/local/sbin/skillport-k3s-deploy
              readOnly: true
            - name: build-tools
              mountPath: /opt/skillport-tools
              readOnly: true
      volumes:
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: jenkins-home
        - name: k3s-bin
          hostPath:
            path: /usr/local/bin/k3s
            type: File
        - name: bridge-artifacts
          hostPath:
            path: /srv/skillport/bridge
            type: DirectoryOrCreate
        - name: deploy-script
          hostPath:
            path: /usr/local/sbin/skillport-k3s-deploy
            type: File
        - name: build-tools
          hostPath:
            path: /srv/skillport/tools
            type: Directory
