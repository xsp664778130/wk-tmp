apiVersion: v1
kind: Service
metadata:
  name: skillport-web
  namespace: skillport
spec:
  clusterIP: 10.43.50.60
  selector:
    app.kubernetes.io/name: skillport-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillport-web
  namespace: skillport
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skillport-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillport-web
        app.kubernetes.io/part-of: skillport
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: web
          image: 10.43.50.40:5000/skillport/web:local
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: SKILLPORT_BACKEND_URL
              value: http://skillport-server.skillport.svc.cluster.local:8080
            - name: SKILLPORT_GATEWAY_KEY
              valueFrom:
                secretKeyRef:
                  name: skillport-secrets
                  key: gateway-key
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
