apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillport-web-public-tunnel
  namespace: skillport
  labels:
    app.kubernetes.io/name: skillport-web-public-tunnel
    app.kubernetes.io/part-of: skillport
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: skillport-web-public-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillport-web-public-tunnel
        app.kubernetes.io/part-of: skillport
    spec:
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2026.7.3
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --protocol
            - http2
            - --url
            - http://skillport-web.skillport.svc.cluster.local:3000
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
