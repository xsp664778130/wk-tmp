map $http_upgrade $skillport_k3s_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    server_name 47.116.50.220 api.jmuyuer.com;

    client_max_body_size 26m;

    location = /actuator/health {
        proxy_pass http://10.43.50.20:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /api/ {
        proxy_pass http://10.43.50.20:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /ws/bridge {
        proxy_pass http://10.43.50.20:9091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $skillport_k3s_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
    }

    location /downloads/ {
        proxy_pass http://10.43.50.20:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 10m;
    }

    location = /bridge/skillport-bridge.jar {
        alias /srv/skillport/bridge/skillport-bridge.jar;
        default_type application/java-archive;
        add_header Cache-Control "no-cache";
    }

    location = /bridge/skillport-bridge.jar.sha256 {
        alias /srv/skillport/bridge/skillport-bridge.jar.sha256;
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    location = /bridge/install-macos.sh {
        proxy_pass http://10.43.50.20:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }

    location = /bridge/install-windows.ps1 {
        proxy_pass http://10.43.50.20:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.jmuyuer.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.jmuyuer.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 127.0.0.1:8081;
    server_name 127.0.0.1 localhost;

    location / {
        proxy_pass http://10.43.50.30:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $skillport_k3s_connection_upgrade;
        proxy_read_timeout 90s;
    }
}

server {
    if ($host = api.jmuyuer.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name 47.116.50.220 api.jmuyuer.com;
    return 404; # managed by Certbot
}

server {
    listen 127.0.0.1:8082;
    server_name 127.0.0.1 localhost;

    location / {
        proxy_pass http://10.43.50.50:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $skillport_k3s_connection_upgrade;
        proxy_read_timeout 90s;
    }
}
