server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: skillport-server
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/skillport?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:skillport}
    password: ${MYSQL_PASSWORD:skillport}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 28MB
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

skillport:
  gateway-key: ${SKILLPORT_GATEWAY_KEY:change-me-before-production}
  session-ttl: ${SKILLPORT_SESSION_TTL:30d}
  storage-root: ${SKILLPORT_STORAGE_ROOT:./data/skills}
  bridge-artifact-root: ${SKILLPORT_BRIDGE_ARTIFACT_ROOT:./data/bridge}
  public-api-base-url: ${SKILLPORT_API_PUBLIC_URL:http://localhost:8080}
  public-netty-base-url: ${SKILLPORT_NETTY_PUBLIC_URL:http://localhost:9091}
  client-release:
    version: 1.0.30
    date: 2026-08-28
    title: 环境高光主题
    changes:
      - 深夜紫、曜石黑与海湾蓝新增多层环境高光，页面更有空间感。
      - 新增极光青与暮霞玫两套高光主题，共支持 6 套可切换配色。
      - 主题菜单改为渐变光晕色卡预览，选择后仍会自动记住。
    download-base-url: ${SKILLPORT_CLIENT_DOWNLOAD_URL:https://www.jmuyuer.com}
  wecom:
    enabled: ${WECOM_ENABLED:false}
    corp-id: ${WECOM_CORP_ID:}
    agent-id: ${WECOM_AGENT_ID:}
    secret: ${WECOM_SECRET:}
    callback-url: ${WECOM_CALLBACK_URL:http://localhost:8080/api/auth/wecom/callback}
  netty:
    port: ${SKILLPORT_NETTY_PORT:9091}
    worker-threads: ${SKILLPORT_NETTY_WORKERS:4}

logging:
  level:
    root: INFO
    com.skillport: INFO
