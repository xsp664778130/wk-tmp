services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: skillport
      MYSQL_USER: skillport
      MYSQL_PASSWORD: skillport
      MYSQL_ROOT_PASSWORD: root-skillport
    ports:
      - "3306:3306"
    volumes:
      - skillport_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uskillport", "-pskillport"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  skillport_mysql:
